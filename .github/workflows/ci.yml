name: ci

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Test
        run: npm run test
      - name: Coverage
        run: npm run test:coverage

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t micro-frontend-starter-kit:ci .
      - name: Smoke shell + remotes
        run: |
          docker run -d --name shell -p 3000:3000 micro-frontend-starter-kit:ci
          docker run -d --name chat -p 3001:3001 micro-frontend-starter-kit:ci npx http-server dist/ai-chat-widget -p 3001 -s
          docker run -d --name obs -p 3002:3002 micro-frontend-starter-kit:ci npx http-server dist/observability-widget -p 3002 -s
          docker run -d --name cost -p 3003:3003 micro-frontend-starter-kit:ci npx http-server dist/cost-widget -p 3003 -s
          for i in {1..25}; do
            if curl -fsS http://localhost:3000/health; then break; fi
            sleep 1
          done
          curl -fsS http://localhost:3000/ready
          curl -fsS http://localhost:3001/remoteEntry.js | head -n 1
          curl -fsS http://localhost:3002/remoteEntry.js | head -n 1
          curl -fsS http://localhost:3003/remoteEntry.js | head -n 1
          docker rm -f shell chat obs cost

  publish:
    needs: docker
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        run: |
          IMAGE=ghcr.io/${{ github.repository_owner }}/micro-frontend-starter-kit
          TAG=${GITHUB_REF_NAME}
          docker build -t $IMAGE:$TAG -t $IMAGE:latest .
          docker push $IMAGE:$TAG
          docker push $IMAGE:latest
